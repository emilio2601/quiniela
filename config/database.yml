# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Postgres.app:
#   gem install pg -- --with-pg-config=/Applications/Postgres.app/Contents/Versions/latest/bin/pg_config
#
<%
  # In production we run on a single PostgreSQL server (one Dokku Postgres
  # service) that hosts four databases. Parse the linked DATABASE_URL once and
  # derive the per-role database names from the primary's name.
  require "uri"
  prod = ENV["DATABASE_URL"] ? URI.parse(ENV["DATABASE_URL"]) : nil
  prod_db = prod && !prod.path.to_s.empty? ? prod.path.delete_prefix("/") : "quiniela_production"
%>
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", ENV["USER"]) %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: quiniela_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: quiniela_test

# Production runs on one PostgreSQL server (the linked Dokku Postgres service,
# exposed as DATABASE_URL) hosting four databases: the primary for application
# data plus dedicated databases for Solid Cache, Solid Queue, and Solid Cable
# so each can be migrated independently. Connection details all come from
# DATABASE_URL; only the database name differs per role.
production:
  primary: &primary_production
    <<: *default
    host: <%= prod&.host || "localhost" %>
    port: <%= prod&.port || 5432 %>
    username: <%= prod&.user || "quiniela" %>
    password: <%= prod&.password %>
    database: <%= prod_db %>
  cache:
    <<: *primary_production
    database: <%= prod_db %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= prod_db %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= prod_db %>_cable
    migrations_paths: db/cable_migrate
