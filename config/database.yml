# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Postgres.app:
#   gem install pg -- --with-pg-config=/Applications/Postgres.app/Contents/Versions/latest/bin/pg_config
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", ENV["USER"]) %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: quiniela_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: quiniela_test

# Store production data in a set of PostgreSQL databases: one primary for
# application data plus dedicated databases for Solid Cache, Solid Queue, and
# Solid Cable so each can be scaled and migrated independently.
production:
  primary: &primary_production
    <<: *default
    database: quiniela_production
    username: quiniela
    password: <%= ENV["QUINIELA_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: quiniela_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: quiniela_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: quiniela_production_cable
    migrations_paths: db/cable_migrate
